<html>

<HEAD>
    <TITLE>Fist Website</TITLE>
</HEAD>

<BODY>

    </br>
    <h1 align="center" style="color: black"> Primeiro projeto JS e HTML</h1>
    </br>
    </br>

    <p align="center"> Bem vindos, meu primeiro projeto em HTML</p>
    <p align="center"> Vamos criar um mini jogo interativo, utilizando JS e HTML para aprimoramento da interface.</p>
    <p align="center"> Também utilizando GIT/GIT HUB para salvar o projeto.</p>
    </p>
</br>
</br>

    <canvas id="folha" width="600" height="500"></canvas>
</BODY>

<script>
    
    window.onload = function(){
        setInterval(executar, 1000/60);
    }   
    
    var posicaoBolaX = posicaoBolaY = 30;
    var velocidadeBolaX = velocidadeBolaY = 5;
    var posicaoJogador1 = posicaoJogador2 = 30;
    var pontuacaoJg1 = pontuacaoJg2 = 0;



    function executar (){
    
    var folhad = document.getElementById("folha");
    var aread = folhad.getContext("2d");

    var larguraCampo = 600;
    var alturaCampo = 500;
    var larguraLinha = 5;
    var AlturaRaquete = 150;
    var espessuraRaquete = 5;
    var tamanhoBola= 10;
    var efeitoRaq = 0.5;
    

    aread.fillStyle = "#286047"; // Cor verde campo

    // Campo de jogo 
    aread.fillRect(0,0,larguraCampo,alturaCampo);

    aread.fillStyle = '#ffffff'; // Cor branca p/ elementos 

    // Linha central
    aread.fillRect(larguraCampo/2 - larguraLinha/2,0,larguraLinha,alturaCampo); 

    // Raquete 1
    aread.fillRect(0,posicaoJogador1,espessuraRaquete,AlturaRaquete);

    // Raquete 2 
    aread.fillRect(larguraCampo - espessuraRaquete,posicaoJogador2,espessuraRaquete,AlturaRaquete);
    
    // Bola 
    aread.fillRect(posicaoBolaX-tamanhoBola/2,posicaoBolaY-tamanhoBola/2,tamanhoBola,tamanhoBola); 
     
    posicaoBolaX= posicaoBolaX + velocidadeBolaX;
    posicaoBolaY= posicaoBolaY + velocidadeBolaY;
    
    // Regras de colisão - Superior e Inferior
    if(posicaoBolaY < 0 && velocidadeBolaY < 0){
        // Aqui após a posição ultrapassar o valor 0, inverte o valor
         velocidadeBolaY = -velocidadeBolaY;
    }
    if (posicaoBolaY > alturaCampo && velocidadeBolaY > 0){
        // Aqui após a posição ultrapassar a alturaCampo, inverte o valor
        velocidadeBolaY = -velocidadeBolaY;
    }

    // Regras de colisão com as raquetes

    // Verificar se o jogador 2 fez ponto
    if(posicaoBolaX < 0){
        if(posicaoBolaY > posicaoJogador1 && posicaoBolaY < posicaoJogador1 + AlturaRaquete){
            velocidadeBolaX = -velocidadeBolaX;
           
        var difY = posicaoBolaY - (posicaoJogador1 + AlturaRaquete/2);
        velocidadeBolaY= difY * efeitoRaq;
        } 
        else {
            pontuacaoJg2 = pontuacaoJg2 + 1;
        }
    } 

    // Verficar se o jogador 1 fez ponto

    if(posicaoBolaX > larguraCampo){
       
        if(posicaoBolaY > posicaoJogador2 && posicaoBolaY < posicaoJogador2 + AlturaRaquete){
            velocidadeBolaX = -velocidadeBolaX;

        var difY = posicaoBolaY - (posicaoJogador2 + AlturaRaquete/2);
        velocidadeBolaY= difY * efeitoRaq;
        } 
        else{
            pontuacaoJg1 = pontuacaoJg1 + 1;
        }
    }

}

</script>

</html>
